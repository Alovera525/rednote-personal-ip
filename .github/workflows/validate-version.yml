name: Validate plugin release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check synchronized versions
        run: node scripts/version.mjs check

      - name: Require one patch increment for pull requests
        if: github.event_name == 'pull_request'
        run: node scripts/version.mjs check-release "${{ github.event.pull_request.base.sha }}"

      - name: Require one patch increment for pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/version.mjs check-release "${{ github.event.before }}"
